<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>할 일 관리</title>
  <!-- 다크 모드 깜빡임(FOUC) 방지: 렌더 전에 테마 적용 -->
  <script>
    (function () {
      var t = localStorage.getItem('theme');
      document.documentElement.dataset.theme = (t === 'dark') ? 'dark' : 'light';
    }());
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">

    <header>
      <h1>할 일 관리</h1>
      <p id="today-date" class="today-date"></p>
      <button id="theme-toggle" class="theme-toggle"
              aria-label="테마 전환" title="테마 전환 (Ctrl+D)"></button>
    </header>

    <section class="dashboard" aria-label="진행률 대시보드">
      <div class="overall-progress">
        <div class="overall-progress-header">
          <span class="overall-label">전체 진행률</span>
          <div class="progress-meta">
            <span id="overall-count">0 / 0</span>
            <span class="meta-sep" aria-hidden="true">·</span>
            <strong id="overall-pct">0%</strong>
          </div>
        </div>
        <div class="progress-track" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
          <div class="progress-fill" id="overall-bar"></div>
        </div>
      </div>

      <div class="category-stats">
        <div class="category-stat">
          <div class="category-stat-header">
            <span class="cat-name cat-work-name">업무</span>
            <span class="cat-count" id="count-work">0 / 0</span>
          </div>
          <div class="progress-track mini">
            <div class="progress-fill work-fill" id="bar-work"></div>
          </div>
        </div>
        <div class="category-stat">
          <div class="category-stat-header">
            <span class="cat-name cat-personal-name">개인</span>
            <span class="cat-count" id="count-personal">0 / 0</span>
          </div>
          <div class="progress-track mini">
            <div class="progress-fill personal-fill" id="bar-personal"></div>
          </div>
        </div>
        <div class="category-stat">
          <div class="category-stat-header">
            <span class="cat-name cat-study-name">공부</span>
            <span class="cat-count" id="count-study">0 / 0</span>
          </div>
          <div class="progress-track mini">
            <div class="progress-fill study-fill" id="bar-study"></div>
          </div>
        </div>
      </div>
    </section>

    <section class="input-section" aria-label="할 일 입력">
      <input
        type="text"
        id="todo-input"
        placeholder="새로운 할 일을 입력하세요…"
        autocomplete="off"
        aria-label="할 일 입력"
      />
      <select id="category-select" aria-label="카테고리 선택">
        <option value="personal">개인</option>
        <option value="work">업무</option>
        <option value="study">공부</option>
      </select>
      <button id="add-btn">추가</button>
    </section>

    <main>
      <div class="filter-tabs" role="tablist" aria-label="카테고리 필터">
        <button class="filter-tab active" data-filter="all"      role="tab" aria-selected="true">전체</button>
        <button class="filter-tab"        data-filter="work"     role="tab" aria-selected="false">업무</button>
        <button class="filter-tab"        data-filter="personal" role="tab" aria-selected="false">개인</button>
        <button class="filter-tab"        data-filter="study"    role="tab" aria-selected="false">공부</button>
      </div>

      <div class="list-controls">
        <label for="sort-select" class="sort-label">정렬</label>
        <select id="sort-select">
          <option value="newest">최신순</option>
          <option value="oldest">오래된순</option>
          <option value="incomplete">미완료 우선</option>
        </select>
      </div>

      <ul id="todo-list" aria-label="할 일 목록"></ul>
      <p id="empty-message" class="empty-message" role="status">등록된 할 일이 없습니다.</p>

      <div class="list-footer">
        <div class="data-btns">
          <button id="export-btn" class="data-btn">내보내기</button>
          <button id="import-btn" class="data-btn">가져오기</button>
          <!-- 파일 선택은 JS에서 프로그래밍 방식으로 트리거 -->
          <input type="file" id="import-input" accept=".json" hidden aria-hidden="true">
        </div>
        <button id="clear-completed-btn" class="clear-completed-btn" disabled>
          완료 항목 삭제
        </button>
      </div>
    </main>

    <footer class="shortcuts-hint" aria-label="단축키 안내">
      <kbd>/</kbd> 입력창 포커스 &nbsp;·&nbsp; <kbd>Ctrl+D</kbd> 다크 모드 전환
    </footer>

  </div>

  <script src="script.js"></script>
</body>
</html>
