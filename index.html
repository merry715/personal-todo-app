<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>할 일 관리</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>할 일 관리</h1>
    </header>

    <section class="input-section">
      <input
        type="text"
        id="todo-input"
        placeholder="새로운 할 일을 입력하세요…"
        autocomplete="off"
      />
      <button id="add-btn">추가</button>
    </section>

    <main>
      <ul id="todo-list"></ul>
      <p id="empty-message" class="empty-message">등록된 할 일이 없습니다.</p>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
